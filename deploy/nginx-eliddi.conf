# /etc/nginx/conf.d/eliddi.conf
# Terminates HTTPS and passes requests to the backend on this machine.
# Replace diary.example.org and the certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name diary.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name diary.example.org;

    ssl_certificate     /etc/pki/tls/certs/diary.example.org.crt;
    ssl_certificate_key /etc/pki/tls/private/diary.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # a diary snapshot is at most 1 MB (ELIDDI_STATE_MAX_BYTES)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # SET, not appended to: a client must not be able to choose the address
        # the login rate limit sees (ELIDDI_PROXY_HOPS=1 trusts this one value)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
